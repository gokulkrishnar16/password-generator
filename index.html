<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Professional Password Vault & Generator</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a, #1e293b);
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #0ea5e9;
      --border: #334155;
      --input-bg: #0f172a;
      
      --strength-weak: #ef4444;
      --strength-medium: #f59e0b;
      --strength-strong: #10b981;
    }

    body.light {
      --bg-gradient: linear-gradient(135deg, #f1f5f9, #e2e8f0);
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --accent: #0284c7;
      --border: #e2e8f0;
      --input-bg: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      width: 100%;
      max-width: 440px;
      padding: 32px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
    }

    .control-group {
      flex: 1;
    }

    .control-group label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 6px;
      display: block;
      font-weight: 600;
    }

    select, input[type="text"], input[type="password"] {
      width: 100%;
      padding: 10px 14px;
      background: var(--input-bg);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    select:focus, input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 24px;
      text-align: center;
      letter-spacing: -0.025em;
    }

    .section {
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    /* Grid layout for character options */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .option-checkbox {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      user-select: none;
    }

    .option-checkbox input {
      accent-color: var(--primary);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    /* Main CTA Button */
    .btn-primary {
      display: block;
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      margin-bottom: 20px;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    /* Output display box with Copy overlay */
    .output-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      margin-bottom: 8px;
    }

    .output-wrapper input {
      padding-right: 70px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 500;
      letter-spacing: 0.05em;
      font-size: 15px;
    }

    .btn-copy {
      position: absolute;
      right: 6px;
      background: var(--primary);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-copy:hover {
      background: var(--primary-hover);
    }

    /* Modern strength bar */
    .strength-container {
      margin-bottom: 24px;
    }

    .strength-track {
      height: 6px;
      background: var(--border);
      border-radius: 9999px;
      overflow: hidden;
    }

    .strength-bar {
      height: 100%;
      width: 0%;
      background: var(--strength-weak);
      border-radius: 9999px;
      transition: width 0.3s ease, background-color 0.3s ease;
    }

    /* History & Secure Panel */
    .secure-section {
      border-top: 1px solid var(--border);
      padding-top: 20px;
    }

    .history-trigger-row {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }

    .history-trigger-row input {
      flex: 1;
    }

    .btn-secondary {
      background: transparent;
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }

    .btn-secondary:hover {
      background: var(--input-bg);
    }

    .status-msg {
      font-size: 12px;
      color: #ef4444;
      margin-top: 6px;
      min-height: 18px;
      text-align: center;
    }

    .history-panel {
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-top: 12px;
      max-height: 160px;
      overflow-y: auto;
      display: none;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .history-pwd {
      font-family: ui-monospace, monospace;
      font-weight: 500;
    }

    .history-time {
      font-size: 10px;
      color: var(--text-muted);
    }

    /* Setup Modal styling */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }

    .modal-card h2 {
      font-size: 18px;
      margin-bottom: 16px;
      text-align: center;
    }

    .modal-card label {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
      display: block;
    }

    .modal-card input {
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

<!-- Setup Password Modal -->
<div id="setup-modal" class="modal-overlay" style="display: none;">
  <div class="modal-card">
    <h2>Set Master Password</h2>
    <label for="setup-master">Create Master Password (min. 5 chars)</label>
    <input type="password" id="setup-master" />
    
    <label for="setup-confirm">Confirm Password</label>
    <input type="password" id="setup-confirm" />
    
    <button class="btn-primary" onclick="setMasterPassword()" style="margin-bottom: 0;">Set Password</button>
    <div id="setup-msg" class="status-msg"></div>
  </div>
</div>

<div class="container">
  <!-- Top Bar: Settings -->
  <div class="top-bar">
    <div class="control-group">
      <label for="themeSelect">Theme</label>
      <select id="themeSelect">
        <option value="dark">Dark Theme</option>
        <option value="light">Light Theme</option>
      </select>
    </div>
    <div class="control-group">
      <label for="fontSizeSelect">Text Size</label>
      <select id="fontSizeSelect">
        <option value="14">Small</option>
        <option value="16" selected>Normal</option>
        <option value="18">Large</option>
      </select>
    </div>
  </div>

  <h1>Secure Generator</h1>

  <!-- Options -->
  <div class="section">
    <div class="control-group" style="margin-bottom: 14px;">
      <label for="size">Password Length</label>
      <select id="size">
        <option value="8">8 Characters</option>
        <option value="12" selected>12 Characters</option>
        <option value="16">16 Characters</option>
        <option value="20">20 Characters</option>
        <option value="24">24 Characters</option>
      </select>
    </div>

    <div class="section-title">Character Sets</div>
    <div class="options-grid">
      <label class="option-checkbox"><input type="checkbox" id="lowercase" checked />Lowercase</label>
      <label class="option-checkbox"><input type="checkbox" id="uppercase" checked />Uppercase</label>
      <label class="option-checkbox"><input type="checkbox" id="numbers" checked />Numbers</label>
      <label class="option-checkbox"><input type="checkbox" id="symbols" checked />Symbols</label>
    </div>
  </div>

  <button class="btn-primary" onclick="generatePassword()">Generate Secure Password</button>

  <!-- Output Box -->
  <div class="section">
    <div class="section-title">Result</div>
    <div class="output-wrapper">
      <input id="password" type="text" readonly placeholder="Click Generate Above" />
      <button class="btn-copy" id="copy-btn" onclick="copyPassword()">Copy</button>
    </div>
    
    <!-- Strength Bar -->
    <div class="strength-container">
      <div class="strength-track">
        <div id="strength-bar" class="strength-bar"></div>
      </div>
    </div>
  </div>

  <!-- Locked History -->
  <div class="secure-section">
    <div class="section-title">Encrypted History</div>
    <label for="master-pwd" style="display:none;">Master Password</label>
    <div class="history-trigger-row">
      <input type="password" id="master-pwd" placeholder="Enter master key..." />
      <button class="btn-secondary" onclick="showHistory()">Unlock</button>
    </div>
    <div id="lock-msg" class="status-msg"></div>
    <div id="history-panel" class="history-panel"></div>
  </div>
</div>

<script>
  // Utilities & State Management
  async function sha256(str) {
    const buf = new TextEncoder('utf-8').encode(str);
    const hashBuffer = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  let masterPasswordHash = localStorage.getItem('master_pwd_hash');

  window.onload = function () {
    applyFontSize(document.getElementById('fontSizeSelect').value);
    if (!masterPasswordHash) {
      document.getElementById('setup-modal').style.display = 'flex';
    }
  };

  async function setMasterPassword() {
    const pwd = document.getElementById('setup-master').value.trim();
    const confirm = document.getElementById('setup-confirm').value.trim();
    const msg = document.getElementById('setup-msg');

    if (!pwd || pwd.length < 5) {
      msg.textContent = 'Password must be at least 5 characters.';
      return;
    }
    if (pwd !== confirm) {
      msg.textContent = 'Passwords do not match.';
      return;
    }

    const hash = await sha256(pwd);
    localStorage.setItem('master_pwd_hash', hash);
    masterPasswordHash = hash;
    msg.style.color = '#10b981';
    msg.textContent = 'Master password saved!';
    
    setTimeout(() => {
      document.getElementById('setup-modal').style.display = 'none';
      msg.textContent = '';
      msg.style.color = '#ef4444';
    }, 1000);
  }

  // Purely Random & Safe Generation
  function generatePassword() {
    const len = parseInt(document.getElementById('size').value, 10);
    const useLower = document.getElementById('lowercase').checked;
    const useUpper = document.getElementById('uppercase').checked;
    const useNum = document.getElementById('numbers').checked;
    const useSym = document.getElementById('symbols').checked;

    if (!useLower && !useUpper && !useNum && !useSym) {
      alert('Please select at least one character set.');
      return;
    }

    const lowerPool = 'abcdefghijklmnopqrstuvwxyz';
    const upperPool = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const numPool = '0123456789';
    const symPool = '!@#$%^&*()_+~`|}{[]:;?><,./-=';

    let combinedPool = '';
    let guaranteedChars = [];

    // Correctly grab 1 guaranteed character per category and assemble pool
    if (useLower) {
      combinedPool += lowerPool;
      guaranteedChars.push(lowerPool[Math.floor(Math.random() * lowerPool.length)]);
    }
    if (useUpper) {
      combinedPool += upperPool;
      guaranteedChars.push(upperPool[Math.floor(Math.random() * upperPool.length)]);
    }
    if (useNum) {
      combinedPool += numPool;
      guaranteedChars.push(numPool[Math.floor(Math.random() * numPool.length)]);
    }
    if (useSym) {
      combinedPool += symPool;
      guaranteedChars.push(symPool[Math.floor(Math.random() * symPool.length)]);
    }

    // Fill the rest of the password length
    let finalArray = [...guaranteedChars];
    for (let i = finalArray.length; i < len; i++) {
      finalArray.push(combinedPool[Math.floor(Math.random() * combinedPool.length)]);
    }

    // Modern Fisher-Yates shuffle algorithm for maximum unpredictable entropy
    for (let i = finalArray.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [finalArray[i], finalArray[j]] = [finalArray[j], finalArray[i]];
    }

    const password = finalArray.join('');
    document.getElementById('password').value = password;

    updateStrengthMeter(password);
    storeHistory(password);
  }

  function assessStrength(password) {
    const len = password.length;
    const hasLower = /[a-z]/.test(password);
    const hasUpper = /[A-Z]/.test(password);
    const hasNum = /[0-9]/.test(password);
    const hasSym = /[^a-zA-Z0-9]/.test(password);
    const diversityCount = [hasLower, hasUpper, hasNum, hasSym].filter(Boolean).length;

    let percentage = 0;
    let color = 'var(--strength-weak)';

    if (len >= 16 && diversityCount === 4) {
      percentage = 100;
      color = 'var(--strength-strong)';
    } else if (len >= 12 && diversityCount >= 3) {
      percentage = 66;
      color = 'var(--strength-medium)';
    } else if (len >= 8 && diversityCount >= 2) {
      percentage = 33;
      color = 'var(--strength-weak)';
    } else {
      percentage = 15;
      color = 'var(--strength-weak)';
    }

    return { percentage, color };
  }

  function updateStrengthMeter(password) {
    const strength = assessStrength(password);
    const bar = document.getElementById('strength-bar');
    bar.style.width = strength.percentage + '%';
    bar.style.backgroundColor = strength.color;
  }

  function storeHistory(pwd) {
    let hist = JSON.parse(localStorage.getItem('pwd_history') || '[]');
    hist.push({ pwd: pwd, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) });
    // Keep only the last 15 items
    if (hist.length > 15) hist.shift();
    localStorage.setItem('pwd_history', JSON.stringify(hist));
  }

  async function showHistory() {
    const master = document.getElementById('master-pwd').value;
    const lockMsg = document.getElementById('lock-msg');
    const histPanel = document.getElementById('history-panel');
    
    lockMsg.textContent = '';
    lockMsg.style.color = '#ef4444';

    if (!masterPasswordHash) {
      lockMsg.textContent = 'Master password has not been initialized.';
      return;
    }

    const userHash = await sha256(master);
    if (userHash === masterPasswordHash) {
      const hist = JSON.parse(localStorage.getItem('pwd_history') || '[]');
      if (hist.length > 0) {
        histPanel.innerHTML = hist
          .slice()
          .reverse()
          .map(h => `
            <div class="history-item">
              <span class="history-pwd">${h.pwd}</span>
              <span class="history-time">${h.time}</span>
            </div>
          `).join('');
      } else {
        histPanel.innerHTML = '<div style="text-align:center; color:var(--text-muted); font-size:12px; padding:10px 0;">No passwords generated yet.</div>';
      }
      histPanel.style.display = 'block';
    } else {
      histPanel.style.display = 'none';
      lockMsg.textContent = 'Incorrect master key.';
    }
  }

  function copyPassword() {
    const pwdInput = document.getElementById('password');
    const copyBtn = document.getElementById('copy-btn');
    if (!pwdInput.value) return;

    navigator.clipboard.writeText(pwdInput.value).then(() => {
      copyBtn.textContent = 'Copied!';
      copyBtn.style.background = 'var(--strength-strong)';
      
      setTimeout(() => {
        copyBtn.textContent = 'Copy';
        copyBtn.style.background = 'var(--primary)';
      }, 1500);
    });
  }

  // UI Event Handlers
  document.getElementById('themeSelect').addEventListener('change', function () {
    if (this.value === 'light') {
      document.body.classList.add('light');
    } else {
      document.body.classList.remove('light');
    }
  });

  document.getElementById('fontSizeSelect').addEventListener('change', function () {
    applyFontSize(this.value);
  });

  function applyFontSize(size) {
    document.querySelector('.container').style.fontSize = size + 'px';
  }
</script>
</body>
</html>
